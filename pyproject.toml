[project]
name = "rotation33"
version = "0.1.0"
description = "Mood-aware vinyl rotation recommendations from a Discogs collection"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0",
    "SQLAlchemy>=2.0",
    "python3-discogs-client>=2.7",
    "alembic>=1.13",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The app is a set of root-level modules run in place,
# not an installed package. Installing this project installs its dependencies only.
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff 0.16 began formatting fenced code blocks inside Markdown, which rewrites
# the hand-aligned samples under docs/ and fails `ruff format --check .` on files
# nobody edited. Those are prose, not source.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic generates every revision with the same import header whether or not
# the revision body uses it. Not worth hand-editing each one.
"migrations/versions/*.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The components are root-level modules run in place, not an installed package.
pythonpath = ["."]
