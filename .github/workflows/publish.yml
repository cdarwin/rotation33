name: publish-image

# Builds the container image and pushes it to GitHub Container Registry.
#
# Tags (docker/metadata-action):
#   - a branch push  -> the sanitised branch name (fix/x -> fix-x) and sha-<sha>
#   - a push to the default branch also moves :latest
#   - a git tag vX.Y.Z -> :X.Y.Z and :X.Y (semver)
#
# The image is multi-arch (amd64 + arm64), so an Apple Silicon or a Pi host and
# an x86 server all pull the right layer from one tag. arm64 is emulated under
# QEMU on the amd64 runner, so those builds are slower than native.
#
# Auth is the built-in GITHUB_TOKEN (packages: write below); no secrets to set.
# The first push creates the package private; flip it to public once in the
# package settings (or `gh api`), and it stays public.

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for the arm64 build on an amd64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cdarwin/rotation33
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
